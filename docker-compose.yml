services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodtrace-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    networks:
      - foodtrace-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodtrace-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - foodtrace-network

networks:
  foodtrace-network:
    driver: bridge